<html lang="en">
<head>
  <meta charset="UTF-8">

  <meta name="description" content="Get in touch with Rowella Galia via email or the contact form below.">

<body>
  <header>
    <h1>Rowella Galia</h1>
    <nav>
      <ul>
        <li><a href="index.html">Home</a></li>
        <li><a href="about.html">About</a></li>
        <li><a href="contact.html">Contact</a></li>
      </ul>
    </nav>
  </header>
  <main>
    <address>
      Email me at: <a href="mailto:ellacontorno4@gmail.com">ellacontorno4@gmail.com</a>
    </address>

    <section>
      <form action="#" method="POST">
        <fieldset>
          <legend>Contact me</legend>
          <p>
            <label for="name">Full name</label>
            <input type="text" id="name" name="name" required minlength="2">
          </p>
          <p>
            <label for="email">Email address</label>
            <input type="email" id="email" name="email" required>
          </p>
          <p>
            <label for="phone">Phone (optional)</label>
            <input type="tel" id="phone" name="phone" pattern="[0-9\-\s]{7,}">
          </p>
          <p>
            <label for="heard">How did you hear about me?</label>
            <select id="heard" name="heard">
              <option value="">-- Select an option --</option>
              <option value="friend">A friend told me</option>
              <option value="school">Through school/classmates</option>
              <option value="social">Social media</option>
              <option value="github">Found you on GitHub</option>
            </select>
          </p>
          <p>
            <label for="message">Message</label>
            <textarea id="message" name="message" rows="5" required></textarea>
          </p>
          <p>
            <label>
              <input type="checkbox" id="agree" name="agree" required>
              I agree to be contacted.
            </label>
          </p>
          <p>
            <button type="submit">Send</button>
          </p>
        </fieldset>
      </form>
    </section>
  </main>
  <footer>
    <p>&copy; 2026 Rowella Galia</p>
  </footer>
</body>
</html>
